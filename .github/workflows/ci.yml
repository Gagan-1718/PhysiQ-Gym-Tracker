name: CI

# Builds both databases from the repository's SQL / JSON files, runs the database
# tests, builds the production app and runs the API tests against it.
on:
  push:
    branches: [main, Gagan-iterations, the-DEMIGOD-iteration]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ci_password
      MYSQL_DATABASE: physiq_db
      # The app and the privilege tests use the least-privilege account (role physiq_app),
      # created by db:init. '%' because the service container sees the runner as a remote host.
      MYSQL_APP_USER: physiq_app
      MYSQL_APP_PASSWORD: ci_app_password
      MYSQL_APP_HOST: '%'
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB: physiq
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runtime dependencies only: build tooling (Tailwind 3's glob/PostCSS chain) never runs on user input
      - name: Dependency audit (runtime packages, high severity and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Build MySQL + MongoDB (schema, routines, triggers, views, indexes, seeds)
        run: npm run db:init

      - name: Database tests (constraints, triggers, procedures, views, Mongo validators)
        run: npm run test:db

      - name: Production build
        run: npm run build

      - name: API tests against the production build
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health > /dev/null && break
            sleep 1
          done
          npm run test:api

      - name: Server log (on failure)
        if: failure()
        run: cat server.log || true
